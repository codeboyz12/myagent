[project]
name = "myagent"
version = "0.1.0"
description = "A lightweight, extensible LLM agent built with Python."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ai[openai]>=0.9.0",
    "cryptography>=50.0.2",
    "fastapi>=0.162.2",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
myagent = "myagent.__main__:main"
myagent-api = "myagent.api:main"
myagent-clean-db = "myagent.clean_db:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
