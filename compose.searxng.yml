services:
  searxng:
    image: searxng/searxng:2026.11.9-57ff753ad
    container_name: myagent-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SEARXNG_PORT:-8080}:8080"
    environment:
      SEARXNG_SETTINGS_PATH: /etc/searxng/settings.yml
      SEARXNG_SECRET: ${SEARXNG_SECRET:-myagent-local-development-only}
    volumes:
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
